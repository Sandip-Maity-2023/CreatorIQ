version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # 1. FastAPI Intelligence Engine Backend
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: creatoriq-backend
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - ./server/.env
    environment:
      - POSTGRES_URL=${POSTGRES_URL:-postgresql://postgres:postgres@postgres:5432/creatoriq}
      - MONGO_URL=${MONGO_URL:-mongodb://mongodb:27017}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./creatoriq.db}
      - SECRET_KEY=${SECRET_KEY:-CREATOR1IQ2SUPER3SECURE4JWT5SECRET6KEY72026}
      - ALGORITHM=${ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_started
      redis:
        condition: service_started
    volumes:
      - sqlite_data:/app

  # ----------------------------------------------------------------------------
  # 2. React + Vite Frontend (Nginx Reverse Proxy)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: creatoriq-frontend
    restart: always
    ports:
      - "5173:80"
      - "3000:80"
    depends_on:
      - backend

  # ----------------------------------------------------------------------------
  # 3. PostgreSQL Database (Relational ACID Business Store)
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: creatoriq-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: creatoriq
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d creatoriq"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # 4. MongoDB (Document Store for Raw API Payloads & Viral Snapshots)
  # ----------------------------------------------------------------------------
  mongodb:
    image: mongo:7.0
    container_name: creatoriq-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  # ----------------------------------------------------------------------------
  # 5. Redis (In-Memory High Speed Cache & Trending Feeds)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7.2-alpine
    container_name: creatoriq-redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  postgres_data:
  mongo_data:
  sqlite_data:
